# Releases dc-choreo-scaffold's two packages when a version tag is pushed.
#
# Push a tag vX.Y.Z on a commit already on main, after both packages'
# package.json say X.Y.Z (they share one version). The job:
#   1. checks the tag matches both versions and the commit is on main
#   2. installs from the committed lockfile and runs the unit tests
#   3. packs the layer
#   4. makes the lockfile new apps start from, and tests it: a throwaway app
#      installs from it with npm ci, type-checks and builds. Only then is its
#      layer entry pointed at this release, and it goes into the command line
#      (scripts/template-lockfile.mjs), so apps start from exactly what this run tested
#   5. packs the command line
#   6. attests both tarballs, so anyone can check they were built here, and
#      keeps the attestation bundle (one bundle covers both tarballs)
#   7. creates the GitHub Release with both tarballs and the bundle attached
#
# There's no npm registry. Builders run the command line from the release:
#   gh release download vX.Y.Z -R DavidsonCollege/dc-choreo-scaffold -p 'davidson-create-choreo-app-*.tgz'
#   gh attestation verify davidson-create-choreo-app-X.Y.Z.tgz --repo DavidsonCollege/dc-choreo-scaffold
#   npx --yes --package ./davidson-create-choreo-app-X.Y.Z.tgz create-choreo-app doctor
# Downloading needs no GitHub sign-in, but fetching the attestation for the
# check does. Where signing in isn't possible (Claude Desktop's Cowork), the
# attached bundle lets the check run without one:
#   gh release download vX.Y.Z -R DavidsonCollege/dc-choreo-scaffold -p 'davidson-create-choreo-app-*.tgz' -p 'davidson-choreo-*.sigstore.jsonl'
#   gh attestation verify davidson-create-choreo-app-X.Y.Z.tgz --repo DavidsonCollege/dc-choreo-scaffold --bundle davidson-choreo-X.Y.Z.sigstore.jsonl
# The bundle can't be forged: the check still proves it was signed for this
# repository's workflow.
# and apps install the layer from its release URL (create-choreo-app's manifest.json).
#
# Permissions, on the job only:
#   contents: write      create the release
#   id-token: write      GitHub's short-lived identity token, which the
#                        attestation is signed with: it proves which repository,
#                        workflow and tag built the files. No access to anything else.
#   attestations: write  store the attestation
#
# Actions are pinned to full commit SHAs. No secrets are used.

name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: The tag matches both packages, and the commit is on main
        run: |
          node -e "
          const tag = process.env.TAG;
          const fail = (m) => { console.log('::error::' + m); process.exit(1); };
          if (!/^v\d+\.\d+\.\d+$/.test(tag)) fail('The tag ' + tag + ' is not vX.Y.Z.');
          for (const dir of ['create-choreo-app', 'choreo-layer']) {
            const { version } = require('./packages/' + dir + '/package.json');
            if ('v' + version !== tag) fail('packages/' + dir + ' is ' + version + ', not ' + tag.slice(1) + '. Both packages share the tag\'s version.');
          }"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$TAG points at a commit that isn't on main. Tag a merged commit."; exit 1; }

      - run: npm ci --no-audit --no-fund
      - run: npm test

      - name: Pack the layer
        run: |
          mkdir dist
          npm pack -w packages/choreo-layer --pack-destination dist

      - name: Make and test the lockfile new apps start from
        run: |
          version="${TAG#v}"
          url=$(node -p "require('./packages/create-choreo-app/src/manifest.json').layer.release.replaceAll('{version}', '$version')")
          node scripts/template-lockfile.mjs --check \
            --layer "dist/davidson-choreo-layer-${version}.tgz" \
            --layer-ref "$url" \
            --out packages/create-choreo-app/templates/app-lock.json

      - name: Pack the command line, with the tested lockfile
        run: |
          npm pack -w packages/create-choreo-app --pack-destination dist
          tar -tzf "dist/davidson-create-choreo-app-${TAG#v}.tgz" | grep -q 'package/templates/app-lock.json' \
            || { echo "::error::The packed command line has no templates/app-lock.json."; exit 1; }
          ls -l dist

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: attest
        with:
          subject-path: dist/*.tgz

      - name: Keep the attestation bundle for the release
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          [ -s "$BUNDLE" ] || { echo "::error::The attest step left no bundle at '$BUNDLE'."; exit 1; }
          cp "$BUNDLE" "dist/davidson-choreo-${TAG#v}.sigstore.jsonl"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          cat > notes.md <<EOF
          The command line and the shared Nuxt layer, version ${version}. Both tarballs are attested: they were built by this repository's release workflow from ${TAG}.

          Check and run the command line:

          \`\`\`
          gh release download ${TAG} -R ${GITHUB_REPOSITORY} -p 'davidson-create-choreo-app-*.tgz'
          gh attestation verify davidson-create-choreo-app-${version}.tgz --repo ${GITHUB_REPOSITORY}
          npx --yes --package ./davidson-create-choreo-app-${version}.tgz create-choreo-app doctor
          \`\`\`

          The check needs a GitHub sign-in to fetch the attestation. Without one, use the attached bundle, which covers both tarballs:

          \`\`\`
          gh release download ${TAG} -R ${GITHUB_REPOSITORY} -p 'davidson-choreo-*.sigstore.jsonl'
          gh attestation verify davidson-create-choreo-app-${version}.tgz --repo ${GITHUB_REPOSITORY} --bundle davidson-choreo-${version}.sigstore.jsonl
          \`\`\`

          Apps made with this version install the layer from this release, and start from the lockfile this release tested: their first install, \`npm ci\`, gets exactly that set of packages.
          EOF
          gh release create "$TAG" dist/*.tgz dist/*.sigstore.jsonl --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file notes.md --verify-tag
