# CI for dc-choreo-scaffold.
#
# test:           the package's unit tests.
# sync:           the copies this package carries of files that live in
#                 DavidsonChoreo/dc-choreo-workflows (the passport schema, PE's
#                 CODEOWNERS block, the deploy stub, and the hashes of AGENTS.md
#                 and CLAUDE.md)
#                 still match that repository's main branch.
# governance-app: a made-up app written by `governance`, checked by the real
#                 Choreo passport, license and files checks.
# test-app:       a made-up paved-road app written by `create` for each tier,
#                 installed with npm ci from the lockfile a release would ship
#                 (scripts/template-lockfile.mjs), with the layer at its packed
#                 file, built and run
#                 through every Choreo check an app faces at the publish request.
#                 The container app's /api guard is then probed against its
#                 built server (.github/scripts/guard-probe.mjs).
#
# Actions are pinned to full commit SHAs. No secrets are used.

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # The dc-choreo-workflows commit whose check code the test apps run. Bump it,
  # by full SHA, when the checks change.
  CHECKS_REF: dfb15197f534a56fc55d3bfe9f9d8dd53cd2e46a

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm test

  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DavidsonChoreo/dc-choreo-workflows
          ref: main
          path: workflows
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: The passport schema copy matches
        run: |
          cmp packages/create-choreo-app/src/schema/passport-v1.json workflows/schemas/passport/v1.schema.json \
            || { echo "::error::src/schema/passport-v1.json differs from dc-choreo-workflows. Copy the schema over it."; exit 1; }
      - name: PE's CODEOWNERS block matches
        run: |
          cmp packages/create-choreo-app/templates/_base/CODEOWNERS workflows/canonical/CODEOWNERS \
            || { echo "::error::templates/_base/CODEOWNERS differs from dc-choreo-workflows canonical/CODEOWNERS."; exit 1; }
      - name: The deploy stub copy matches
        run: |
          cmp packages/create-choreo-app/templates/_base/deploy.yml workflows/canonical/deploy.yml             || { echo "::error::templates/_base/deploy.yml differs from dc-choreo-workflows canonical/deploy.yml. Copy the stub over it."; exit 1; }
      - name: AGENTS.md and CLAUDE.md are listed in canonical/hashes.json
        run: |
          node --input-type=module -e "
          import { createHash } from 'node:crypto';
          import { readFileSync } from 'node:fs';
          const hashes = JSON.parse(readFileSync('workflows/canonical/hashes.json', 'utf8'));
          let failed = false;
          for (const name of ['AGENTS.md', 'CLAUDE.md']) {
            const text = readFileSync('packages/create-choreo-app/templates/_base/' + name, 'utf8').replaceAll('\r\n', '\n');
            const sha = createHash('sha256').update(text).digest('hex');
            if (!(hashes[name] ?? []).some((entry) => entry.sha256 === sha)) {
              console.log('::error::' + name + ' (' + sha + ') is not in dc-choreo-workflows canonical/hashes.json. Add it there first.');
              failed = true;
            }
          }
          process.exit(failed ? 1 : 0);"

  governance-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DavidsonChoreo/dc-choreo-workflows
          ref: ${{ env.CHECKS_REF }}
          path: checks-src
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install the checks
        working-directory: checks-src
        run: npm ci --omit=dev --no-audit --no-fund --loglevel=error
      - name: Write a made-up app with governance
        run: |
          mkdir "$RUNNER_TEMP/example-app"
          node packages/create-choreo-app/bin/create-choreo-app.js governance "$RUNNER_TEMP/example-app" \
            --tier container --answers packages/create-choreo-app/test/fixtures/answers-container.json
      - name: verify passes
        run: node packages/create-choreo-app/bin/create-choreo-app.js verify "$RUNNER_TEMP/example-app"
      - name: The Choreo passport, license and files checks pass
        working-directory: ${{ runner.temp }}/example-app
        run: |
          for check in passport license files; do
            echo "::group::$check"
            node "$GITHUB_WORKSPACE/checks-src/checks/cli.js" "$check"
            echo "::endgroup::"
          done

  test-app:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { tier: container, answers: answers-container.json, indexable: "false" }
          - { tier: pages, answers: answers-pages.json, indexable: "true" }
          - { tier: pages, answers: answers-pages.json, indexable: "false" }
    name: test-app (${{ matrix.tier }}, indexable ${{ matrix.indexable }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DavidsonChoreo/dc-choreo-workflows
          ref: ${{ env.CHECKS_REF }}
          path: checks-src
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install the checks
        working-directory: checks-src
        run: npm ci --omit=dev --no-audit --no-fund --loglevel=error
      - name: Install gitleaks, as the secrets check does
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks

      - name: Pack the layer
        run: |
          mkdir -p "$RUNNER_TEMP/apps"
          cd packages/choreo-layer
          npm pack --pack-destination "$RUNNER_TEMP/apps"
      # The same lockfile a release makes and ships (scripts/template-lockfile.mjs),
      # with the layer at its packed file. create writes it into the app, and the
      # install below is npm ci, so every check runs against exactly that set.
      - name: Make the lockfile new apps start from
        run: |
          tgz=$(cd "$RUNNER_TEMP/apps" && ls davidson-choreo-layer-*.tgz)
          node scripts/template-lockfile.mjs \
            --layer "$RUNNER_TEMP/apps/$tgz" \
            --layer-ref "file:../$tgz" \
            --out packages/create-choreo-app/templates/app-lock.json
      - name: Write a made-up app with create
        env:
          TIER: ${{ matrix.tier }}
          ANSWERS: ${{ matrix.answers }}
          INDEXABLE: ${{ matrix.indexable }}
        run: |
          node -e "
          const answers = require('./packages/create-choreo-app/test/fixtures/' + process.env.ANSWERS);
          answers.indexable = process.env.INDEXABLE === 'true';
          require('fs').writeFileSync(process.env.RUNNER_TEMP + '/answers.json', JSON.stringify(answers));"
          cd "$RUNNER_TEMP/apps"
          node "$GITHUB_WORKSPACE/packages/create-choreo-app/bin/create-choreo-app.js" create example-app \
            --tier "$TIER" --answers "$RUNNER_TEMP/answers.json"
      - name: Point the layer at its packed file, the only change from what create wrote
        working-directory: ${{ runner.temp }}/apps/example-app
        run: |
          node -e "
          const fs = require('fs');
          const written = fs.readFileSync('package.json', 'utf8');
          const pkg = JSON.parse(written);
          const tgz = fs.readdirSync('..').find((f) => /^davidson-choreo-layer-.*\.tgz$/.test(f));
          pkg.dependencies['@davidson/choreo-layer'] = 'file:../' + tgz;
          const changed = Object.keys(pkg.dependencies).filter((k) => pkg.dependencies[k] !== JSON.parse(written).dependencies[k]);
          if (changed.join() !== '@davidson/choreo-layer') { console.log('::error::Unexpected change: ' + changed); process.exit(1); }
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');"
      - name: Install from create's lockfile, and start the git history the secrets check scans
        working-directory: ${{ runner.temp }}/apps/example-app
        run: |
          test -f package-lock.json || { echo "::error::create didn't write package-lock.json from the template's lockfile."; exit 1; }
          npm ci --no-audit --no-fund
          git init -q
          git add -A
          git -c user.name="Choreo CI" -c user.email="ci@example.invalid" commit -q -m "Start the app from create-choreo-app"
      - name: verify, lint and type-check
        working-directory: ${{ runner.temp }}/apps/example-app
        run: |
          node "$GITHUB_WORKSPACE/packages/create-choreo-app/bin/create-choreo-app.js" verify .
          npm run lint
          npm run typecheck

      - name: Every Choreo check passes
        working-directory: ${{ runner.temp }}/apps/example-app
        run: |
          # The layer isn't released yet, so the registry lookup can't find it.
          # Listing it as already present skips only that lookup; every other
          # dependency is still checked.
          echo '{"dependencies":{"@davidson/choreo-layer":"released with this package"}}' > "$RUNNER_TEMP/layer-only.json"
          export BASE_PACKAGE_JSON="$RUNNER_TEMP/layer-only.json"
          CHECKS="$GITHUB_WORKSPACE/checks-src/checks/cli.js"
          failed=""
          # Runs one check. "strict" also fails on a warning, because the
          # indexing and accessibility checks turn "Chrome missing" or "the
          # server didn't start" into a warning that would otherwise pass.
          check() {
            echo "::group::$1"
            out=$(node "$CHECKS" "$1" 2>&1) && code=0 || code=$?
            echo "$out"
            echo "::endgroup::"
            if [ "$code" -ne 0 ]; then failed="$failed $1"; fi
            if [ "${2:-}" = strict ] && echo "$out" | grep -q '::warning'; then failed="$failed $1(warning)"; fi
          }
          for name in passport license files tier code dependencies; do check "$name"; done

          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 0 \
            --report-format json --report-path "$RUNNER_TEMP/gitleaks.json" .
          GITLEAKS_REPORT="$RUNNER_TEMP/gitleaks.json" check secrets

          npm ci --no-audit --no-fund
          # A vulnerable dependency warns and never fails (decision 40 in
          # pipeline.md), so the audit runs like every other check.
          check audit
          "$GITHUB_WORKSPACE/checks-src/node_modules/.bin/knip" --dependencies --reporter json --no-exit-code \
            > "$RUNNER_TEMP/knip.json" 2>/dev/null || rm -f "$RUNNER_TEMP/knip.json"
          KNIP_REPORT="$RUNNER_TEMP/knip.json" check unused

          npm run build
          check indexing strict
          check accessibility strict

          if [ -n "$failed" ]; then echo "::error::Failed:$failed"; exit 1; fi

      # The container app's /api guard, run against its built server. Two
      # throwaway routes are written into the temporary app, never the template.
      # Made-up GUIDs stand in for the Entra ids; no real token is used.
      - name: The /api guard refuses what it should (container)
        if: matrix.tier == 'container'
        working-directory: ${{ runner.temp }}/apps/example-app
        env:
          PROBE: ${{ github.workspace }}/.github/scripts/guard-probe.mjs
        run: |
          mkdir -p server/api
          printf '// CI probe route.\nexport default defineEventHandler(async (event) => ({ id: (await requireUser(event)).id }))\n' > server/api/ci-probe.get.ts
          cp server/api/ci-probe.get.ts server/api/ci-probe.post.ts
          npm run build

          if grep -rqE 'Dana Example|__nuxt_devtools__' .output/server; then
            echo "::error::The built server holds the dev user or devtools, which must never ship."
            exit 1
          fi

          wait_for() { for i in $(seq 1 30); do curl -sf -o /dev/null "http://localhost:$1/health" && return 0; sleep 1; done; echo "::error::The server didn't start on port $1."; return 1; }

          PORT=3101 NUXT_CHOREO_ENTRA_TENANT_ID=11111111-2222-3333-4444-555555555555 \
            NUXT_CHOREO_ENTRA_CLIENT_ID=66666666-7777-8888-9999-000000000000 \
            node .output/server/index.mjs > "$RUNNER_TEMP/configured.log" 2>&1 &
          configured=$!
          wait_for 3101
          node "$PROBE" http://localhost:3101 configured || { kill $configured; cat "$RUNNER_TEMP/configured.log"; exit 1; }
          kill $configured

          PORT=3102 node .output/server/index.mjs > "$RUNNER_TEMP/unconfigured.log" 2>&1 &
          unconfigured=$!
          wait_for 3102
          node "$PROBE" http://localhost:3102 unconfigured || { kill $unconfigured; cat "$RUNNER_TEMP/unconfigured.log"; exit 1; }
          kill $unconfigured

      # Server code outside the /api guard is warned about, never a failed build
      # (the layer's decision 7). Runs last: it adds throwaway files to the app.
      - name: Code outside the /api guard warns but builds (container)
        if: matrix.tier == 'container'
        working-directory: ${{ runner.temp }}/apps/example-app
        run: |
          set -o pipefail
          mkdir -p server/routes server/middleware app/components
          printf '// Throwaway.\nexport default defineEventHandler(() => ({ ok: true }))\n' > server/routes/outside.get.ts
          printf '// Throwaway.\nexport default defineEventHandler(() => {})\n' > server/middleware/outside.ts
          printf '<template><p>Throwaway</p></template>\n' > app/components/Outside.server.vue
          npm run build 2>&1 | tee "$RUNNER_TEMP/outside.log"
          count=$(grep -c 'flagged for review at the publish request' "$RUNNER_TEMP/outside.log" || true)
          if [ "$count" -ne 3 ]; then echo "::error::Expected 3 warnings for code outside the guard, got $count."; exit 1; fi
